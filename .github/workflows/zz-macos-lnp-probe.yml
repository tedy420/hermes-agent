# TEMPORARY probe, never merge: real-code A/B of who macOS holds responsible for the gateway Hermes
# starts (ensure + update-time restart watcher), before and after the starting app quits.
name: zz macOS LNP probe (temporary)

on:
  push:
    branches: ["proof/macos-lnp-gateway"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: base
            sha: 000861be39aa261671b197f374aa032a51c59f3e
          - arm: head
            sha: fcd9890fc747b1edcb2b4c16fec876bb65971217
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          path: probe
          sparse-checkout: .github/lnp-probe
      - name: Set up locked Python
        id: pm
        timeout-minutes: 20
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all"]'
      - name: probe
        timeout-minutes: 12
        run: '"${{ steps.pm.outputs.python-path }}" probe/.github/lnp-probe/real_driver.py "$RUNNER_TEMP/lnp" "$GITHUB_WORKSPACE"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lnp-real-${{ matrix.arm }}
          path: ${{ runner.temp }}/lnp
